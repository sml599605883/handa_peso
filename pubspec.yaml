name: handa_peso
description: "Handa Peso - a Filipino cash-loan matchmaking and money-management app."
# 下面这行用于防止该包被 `flutter pub publish` 意外发布到 pub.dev。
# 私有包建议保留此设置。
publish_to: 'none' # 若要发布到 pub.dev，请删除此行

# 下面配置应用的版本号与构建号。
# 版本号由点号分隔的三个数字组成，例如 1.2.43，
# 后面可再接一个以 + 分隔的构建号。
# 在 flutter build 时，可通过 --build-name 和 --build-number 分别覆盖
# 版本号与构建号。
# 在 Android 中，build-name 对应 versionName，build-number 对应 versionCode。
# 有关 Android 版本管理的更多信息，请参阅 https://developer.android.com/studio/publish/versioning
# 在 iOS 中，build-name 对应 CFBundleShortVersionString，build-number 对应 CFBundleVersion。
# 有关 iOS 版本管理的更多信息，请参阅
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# 在 Windows 中，build-name 是产品与文件版本的主版本号、次版本号和修订号部分，
# 而 build-number 用作构建后缀。
version: 1.0.0+1

environment:
  sdk: ^3.13.3

# 依赖项声明你的包正常工作所需的其他包。
# 若想自动把依赖升级到最新版本，可运行 `flutter pub upgrade --major-versions`。
# 也可以手动把下面的版本号改为 pub.dev 上的最新版本，从而更新依赖。
# 若要查看哪些依赖有更新的版本，请运行 `flutter pub outdated`。
dependencies:
  flutter:
    sdk: flutter

  # 下面这行会向应用添加 Cupertino Icons 字体。
  # 可与 CupertinoIcons 类配合用于 iOS 风格图标。
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  decimal: ^3.2.4
  dio: ^5.9.0
  encrypt: ^5.0.3
  flutter_easyloading: ^3.0.5
  flutter_inappwebview: ^6.1.5
  get: ^4.7.3
  image_picker: ^1.2.2
  intl: ^0.20.2
  package_info_plus: ^10.2.1
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 下面的 "flutter_lints" 包包含一组推荐 lint，用于鼓励良好的编码实践。
  # 该包提供的 lint 集在包根目录的 `analysis_options.yaml` 文件中启用。
  # 关于如何停用特定 lint 规则和启用更多规则，请参阅该文件。
  flutter_lints: ^6.0.0

# 关于本文件中通用 Dart 部分的说明，请参阅：
# https://dart.dev/tools/pub/pubspec

# 下面这一节是 Flutter 包特有的配置。
flutter:
  config:
    enable-swift-package-manager: false

  # 下面这行确保 Material Icons 字体被打包进应用，
  # 从而可以使用 material Icons 类中的图标。
  uses-material-design: true

  assets:
    - assets/
    - assets/login/

  # 若要向应用添加资源，可像这样添加 assets 配置节：
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # 一个图片资源可以引用一个或多个分辨率特定的 "variants"，参见
  # https://flutter.dev/to/resolution-aware-images

  # 关于从包依赖中添加资源的详情，请参阅
  # https://flutter.dev/to/asset-from-package

  # 若要向应用添加自定义字体，请在此处的 "flutter" 配置节中添加 fonts 配置节。
  # 该列表中的每一项都应包含一个 "family" 键（字体族名称）和一个 "fonts" 键，
  # 后者是一个列表，给出字体资源及其他描述信息。例如：
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # 关于从包依赖中添加字体的详情，
  # 请参阅 https://flutter.dev/to/font-from-package
